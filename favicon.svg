<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Deep Navy Rounded Base -->
    <rect width="100" height="100" rx="22" fill="#0A192F"/>
    
    <!-- Blueprint grid background inside logo -->
    <line x1="20" y1="50" x2="80" y2="50" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1"/>
    
    <!-- Outer gold circle -->
    <circle cx="50" cy="50" r="30" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- Monogram letter 'E' in elegant Playfair Display Serif style -->
    <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Playfair Display', 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#D4AF37">E</text>
    
    <!-- Stylized structural cross-hairs -->
    <circle cx="50" cy="20" r="2.5" fill="#D4AF37"/>
    <circle cx="50" cy="80" r="2.5" fill="#D4AF37"/>
</svg>
